databases:
  - name: your-place-db
    databaseName: your_place
    user: your_place_user
    plan: free

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: your-place-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: DATABASE_URL
        fromDatabase:
          name: your-place-db
          property: connectionString
      # Update this after the frontend is first deployed to its actual URL
      - key: ALLOWED_ORIGINS
        value: https://your-place-app.onrender.com

  # ── Frontend Static Site ─────────────────────────────────────────────────────
  - type: web
    name: your-place-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Update this if the backend service name changes and gets a different URL
      - key: VITE_API_URL
        value: https://your-place-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
